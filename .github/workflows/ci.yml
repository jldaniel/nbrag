name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  devcontainer:
    name: Build and scan devcontainer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build devcontainer image
        run: docker build --pull=false -f .devcontainer/Dockerfile -t nbrag-devcontainer:ci .

      - name: Scan devcontainer image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nbrag-devcontainer:ci
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  test:
    name: Lint, type check, test, audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Check lockfile
        run: uv lock --check

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Tests
        run: uv run pytest

      - name: Bandit
        run: uv run bandit -c pyproject.toml -r src

      - name: Dependency audit
        run: uv run pip-audit --cache-dir .cache/pip-audit
