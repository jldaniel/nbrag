[project]
name = "nbrag"
version = "0.1.0"
description = "Notebook-aware RAG over Jupyter notebooks with small local Ollama models."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Jason Daniel" }]
dependencies = [
    "nbformat>=5.10.4",
]

[project.scripts]
nbrag-chat = "nbrag.chat_cli:main"
nbrag-embed = "nbrag.embed_cli:main"

[dependency-groups]
dev = [
    "bandit[toml]>=1.8.6",
    "detect-secrets>=1.5.0",
    "pip-audit>=2.9.0",
    "pyright>=1.1.407",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nbrag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PGH",
    "PIE",
    "PTH",
    "PYI",
    "RUF",
    "S",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts = "--cov=nbrag --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["nbrag"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
